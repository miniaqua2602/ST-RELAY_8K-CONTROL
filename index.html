<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>ST RELAY CONTROL - CLOUD</title>
<style>
  body { background-color: #03031f; color: #ffffff; font-family: Arial, Helvetica, sans-serif; font-weight: bold; margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; }
  .container { width: 100%; max-width: 480px; }
  .card { background: #0a0a2e; border: 2px solid #005580; border-radius: 12px; padding: 16px; margin: 10px 0; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .header-card { text-align: center; background: #080829; border: 2px solid #0088cc; border-radius: 12px; padding: 16px; margin: 10px 0; }
  .header-card h2 { color: #ffffff; font-size: 20px; font-weight: 900; margin: 0 0 4px 0; letter-spacing: 1px; }
  .subtitle { color: #4da6ff; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; font-weight: 900; margin-bottom: 12px; }
  .net-banner { padding: 10px; font-size: 12px; text-align: center; background: #5c3a06; border: 2px solid #f59e0b; color: #ffffff; border-radius: 8px; font-weight: 900; }
  .weather-card { background: #080829; border: 2px solid #0088cc; border-radius: 10px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .weather-temp { font-size: 24px; font-weight: 900; color: #fcd34d; }
  .weather-desc { font-size: 11px; color: #8ab4f8; margin-top: 4px; font-weight: 900; text-transform: uppercase; }
  .weather-time { font-size: 13px; color: #ffffff; margin-top: 4px; font-weight: 900; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .ch-btn { padding: 12px 2px; font-size: 11px; font-weight: 900; border: 2px solid #005580; border-radius: 8px; cursor: pointer; color: #8ab4f8; background: #05051f; text-transform: uppercase; transition: 0.1s; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-on { border-color: #ef4444; background: #4a0000; color: #ffffff; box-shadow: 0 0 10px rgba(239,68,68,0.4); }
  .ch-timer { border-color: #a855f7; background: #3b0066; color: #ffffff; box-shadow: 0 0 10px rgba(168,85,247,0.4); }
  .config-box h3 { font-size: 13px; color: #4da6ff; margin-top: 0; border-bottom: 1px dashed #005580; padding-bottom: 8px; font-weight: 900; text-transform: uppercase; }
  label { font-size: 10px; color: #8ab4f8; display: block; margin-top: 10px; text-transform: uppercase; font-weight: 900; }
  select, input[type='text'] { width: 100%; padding: 10px; margin: 4px 0; border-radius: 8px; border: 2px solid #005580; background: #05051f; color: #ffffff; font-size: 12px; font-weight: bold; box-sizing: border-box; outline: none; }
  .time-picker-row { display: flex; gap: 6px; align-items: center; }
  .time-sel { width: 45%!important; padding: 8px!important; font-size: 14px!important; font-weight: 900!important; color: #fcd34d!important; text-align: center!important; background: #05051f!important; border: 2px solid #005580!important; border-radius: 8px!important; }
  .name-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .name-btn { width: 40%; padding: 10px; border-radius: 8px; border: 2px solid #3b82f6; background: #0e3073; color: #ffffff; font-weight: 900; font-size: 11px; cursor: pointer; }
  .slot-card { background: #05051f; padding: 10px; border-radius: 8px; margin-top: 12px; border: 2px solid #005580; }
  .slot-header { display: flex; justify-content: space-between; align-items: center; background: #0a0a2e; padding: 8px 10px; border-radius: 6px; border: 1px dashed #4da6ff; }
  .slot-header span { font-weight: 900; color: #4da6ff; font-size: 12px; }
  .toggle-wrap { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #ffffff; font-weight: 900; font-size: 11px; }
  .toggle-wrap input[type='checkbox'] { width: 16px; height: 16px; accent-color: #22c55e; }
  .days-row { display: flex; justify-content: space-between; font-size: 10px; margin-top: 10px; color: #8ab4f8; background: #0a0a2e; padding: 8px 4px; border-radius: 6px; border: 1px solid #005580; }
  .days-row label { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-weight: bold; margin: 0; font-size: 9px; }
  .days-row input[type='checkbox'] { accent-color: #3b82f6; width: 14px; height: 14px; margin: 0; }
</style>
<script src='https://unpkg.com/mqtt/dist/mqtt.min.js'></script>
<script>
  var mqttClient = null;
  var deviceId = 'F8F8'; 
  var topicCmd = '';
  var topicState = '';
  var channelNames = ['CH1', 'CH2', 'CH3', 'CH4', 'CH5', 'CH6', 'CH7', 'CH8'];
  var channelStates = [false, false, false, false, false, false, false, false];
  var timerFlashExpiry = [0, 0, 0, 0, 0, 0, 0, 0];
  var allSchedules = Array(8).fill().map(() => Array(5).fill().map(() => ({
    active: false, on: '06:00', off: '08:00', days: [true, true, true, true, true, true, true]
  })));

  function getUrlParameter(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
  }

  function initMQTT() {
    var idParam = getUrlParameter('id');
    if (idParam) {
      deviceId = idParam.trim().toUpperCase();
    }
    topicCmd = 'miniaqua/' + deviceId + '/cmd';
    topicState = 'miniaqua/' + deviceId + '/state';
    
    document.getElementById('device_id_display').innerText = 'ID: ' + deviceId;

    var nb = document.getElementById('net_banner');
    var brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
    mqttClient = mqtt.connect(brokerUrl, { keepalive: 30, reconnectPeriod: 2000 });

    mqttClient.on('connect', () => {
      nb.innerText = 'ĐÃ KẾT NỐI CLOUD (ONLINE)';
      nb.style.background = '#06402b';
      nb.style.borderColor = '#22c55e';
      mqttClient.subscribe(topicState);
    });

    mqttClient.on('message', (topic, msg) => {
      try {
        var data = JSON.parse(msg.toString());
        if (data.states) channelStates = data.states;
        if (data.names) channelNames = data.names;
        if (data.temp !== undefined) {
          document.getElementById('temp').innerText = data.temp;
          document.getElementById('desc').innerText = data.desc || 'ST SYSTEM';
        }
        renderRelayGrid();
      } catch(e) { console.error(e); }
    });
  }

  function renderRelayGrid() {
    var grid = document.getElementById('relayGrid');
    grid.innerHTML = '';
    for (let i = 0; i < 8; i++) {
      let btn = document.createElement('button');
      let isOn = channelStates[i];
      btn.className = 'ch-btn ' + (isOn ? 'ch-on' : '');
      btn.innerText = channelNames[i];
      btn.onclick = () => toggleChannel(i);
      grid.appendChild(btn);
    }
  }

  function toggleChannel(i) {
    let chNum = i + 1;
    let targetState = !channelStates[i];
    let cmd = targetState ? 'CH' + chNum + '_ON' : 'CH' + chNum + '_OFF';
    if (mqttClient && mqttClient.connected) {
      mqttClient.publish(topicCmd, cmd, { qos: 1 });
    }
    channelStates[i] = targetState;
    renderRelayGrid();
  }

  window.onload = () => {
    renderRelayGrid();
    initMQTT();
  };
</script>
</head><body>
<div class="container">
  <div class="header-card">
    <h2>ST RELAY CONTROL</h2>
    <div class="subtitle">SYSTEM FOUNDED BY MINIAQUA</div>
    <div id='net_banner' class='net-banner'>ĐANG KẾT NỐI CLOUD...</div>
    <div id='device_id_display' style='font-size: 11px; color: #4da6ff; margin-top: 6px; font-weight: 900;'></div>
  </div>
  <div class="card">
    <div class="weather-card">
      <div class="weather-left">
        <div class="weather-temp"><span id='temp'>--</span>°C</div>
        <div class="weather-desc" id='desc'>ĐANG TẢI...</div>
      </div>
      <div class='weather-icon'>☀️</div>
    </div>
    <div style='font-size: 12px; color: #8ab4f8; margin-bottom: 6px; font-weight: 900; text-transform: uppercase;'>TRẠNG THÁI 8 KÊNH RƠ-LE:</div>
    <div class="grid" id='relayGrid'></div>
  </div>
</div>
</body></html>
